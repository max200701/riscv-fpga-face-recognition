<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HDMI 纯图像源</title>
<style>html,body{margin:0;height:100%;background:#142538;color:#e8f3ff;font:16px system-ui}main{max-width:700px;margin:8vh auto;padding:25px;line-height:1.8}button{padding:12px 20px;background:#2176bc;color:white;border:0;border-radius:8px;font:inherit}#screen{display:none;position:fixed;inset:0;background:black}canvas{display:block;image-rendering:pixelated}#warn{position:absolute;inset:0;background:#361c22;padding:30px;white-space:pre-wrap}</style>
<main><h1>HDMI 纯图像源</h1><p>将本窗口放到 FPGA 对应的 HDMI 输出，设置 640 × 480 后进入全屏。本页只提供像素，不做人脸计算，也不绘制识别框。</p><p>登记、识别结果与温度显示在控制台。当前图片在采集与识别完成、释放之前保持不变。</p><button id="full" disabled>全屏显示图片</button><button id="choose" disabled>选择 HDMI 屏并全屏</button><p>可先用 Win+Shift+方向键将本窗口移至 FPGA 扩展屏，再全屏。本操作台应留在笔记本屏幕。</p><p id="info">正在读取图片…</p></main><div id="screen"><canvas id="canvas" width="640" height="480"></canvas><div id="warn"></div></div>
<script>
'use strict';const sourceInstance=crypto.randomUUID();const nonce='__NONCE__',c=document.getElementById('canvas'),screenEl=document.getElementById('screen'),ctx=c.getContext('2d',{alpha:false,colorSpace:'srgb',willReadFrequently:true});let current=null,painted=false,crc=null,busy=false;
const crcTable=new Uint32Array(256);for(let n=0;n<256;n++){let x=n;for(let k=0;k<8;k++)x=(x>>>1)^((x&1)?0xedb88320:0);crcTable[n]=x;}
function crc32(bytes){let v=0xffffffff;for(const b of bytes)v=(v>>>8)^crcTable[(v^b)&255];return((v^0xffffffff)>>>0).toString(16).padStart(8,'0');}
function diagnostics(){const d=devicePixelRatio,w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);c.style.width=640/d+'px';c.style.height=480/d+'px';return{provider:'BROWSER',source_instance:sourceInstance,source_id:current?.source_id,physical_width:w,physical_height:h,fullscreen:document.fullscreenElement===screenEl,viewport_matches:w===640&&h===480,painted,rgb_crc32:crc};}
function update(){const d=diagnostics(),ok=d.fullscreen&&d.viewport_matches&&d.painted;document.getElementById('warn').style.display=ok?'none':'block';document.getElementById('warn').textContent='当前画布不满足采集条件\n需全屏 640×480，当前 '+d.physical_width+'×'+d.physical_height;return d;}
async function sendReport(){if(!current)return;const r=await fetch('/display-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nonce,...update()})});if(!r.ok)throw Error('Display report HTTP '+r.status);}
async function refresh(){if(busy)return;busy=true;try{
 const r=await fetch('/source-frame?after='+String(current?.source_id??-1));if(!r.ok)throw Error('Source HTTP '+r.status);
 const raw=await r.arrayBuffer();if(raw.byteLength<4)throw Error('Source packet header');
 const n=new DataView(raw).getUint32(0,true);if(n>65536||n+4>raw.byteLength)throw Error('Source manifest extent');
 const m=JSON.parse(new TextDecoder().decode(new Uint8Array(raw,4,n))),rgb=new Uint8Array(raw,4+n);
 if(current?.source_id!==m.source_id){
  painted=false;if(rgb.length!==921600||crc32(rgb)!==m.files['frame.rgb'].crc32)throw Error('Source identity or CRC mismatch');
  const im=ctx.createImageData(640,480);for(let i=0,j=0;i<rgb.length;i+=3,j+=4){im.data[j]=rgb[i];im.data[j+1]=rgb[i+1];im.data[j+2]=rgb[i+2];im.data[j+3]=255;}ctx.putImageData(im,0,0);
  const back=ctx.getImageData(0,0,640,480).data,checked=new Uint8Array(rgb.length);for(let i=0,j=0;i<rgb.length;i+=3,j+=4){checked[i]=back[j];checked[i+1]=back[j+1];checked[i+2]=back[j+2];}
  crc=crc32(checked);painted=crc===m.files['frame.rgb'].crc32;current=m;
  document.getElementById('info').textContent='图片 '+m.source_id+' · RGB CRC32 '+crc;
  document.getElementById('full').disabled=!painted;document.getElementById('choose').disabled=!painted;
 }
 await sendReport();
}catch(e){painted=false;current=null;document.getElementById('info').textContent=e.message;update();throw e;}finally{busy=false;}}
async function followSource(){for(;;){try{await refresh();}catch(e){await new Promise(resolve=>setTimeout(resolve,250));}}}
async function selectThis(){if(!current||!painted)throw Error('图像尚未就绪');await sendReport();const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nonce,action:'select_display',provider:'BROWSER',source_instance:sourceInstance})});if(!r.ok)throw Error((await r.json()).error);}
document.getElementById('choose').onclick=async()=>{try{if(!window.getScreenDetails)throw Error('此浏览器不支持自动选屏，请用 Win+Shift+方向键移到 FPGA 屏后点击全屏。');const details=await window.getScreenDetails();const candidates=details.screens.filter(s=>/FPGA/i.test(s.label)||(s.width*devicePixelRatio===640&&s.height*devicePixelRatio===480&&!s.isPrimary));if(candidates.length!==1)throw Error('没有唯一的 FPGA 640×480 屏，请先检查 Windows 扩展模式及分辨率，再手动移窗全屏。');await selectThis();screenEl.style.display='block';await screenEl.requestFullscreen({screen:candidates[0],navigationUI:'hide'});update();}catch(e){if(!document.fullscreenElement)screenEl.style.display='none';document.getElementById('info').textContent=e.message;}};document.getElementById('full').onclick=async()=>{try{await selectThis();screenEl.style.display='block';await screenEl.requestFullscreen({navigationUI:'hide'});}catch(e){screenEl.style.display='none';document.getElementById('info').textContent=e.message;}update();};document.addEventListener('fullscreenchange',()=>{screenEl.style.display=document.fullscreenElement===screenEl?'block':'none';update();sendReport().catch(()=>{});});window.addEventListener('resize',()=>{update();sendReport().catch(()=>{});});document.addEventListener('visibilitychange',()=>sendReport().catch(()=>{}));window.sourceDiagnostics=diagnostics;followSource();
</script></html>
