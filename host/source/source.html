<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPGA HDMI 精确画布</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101723;color:#eaf2fc;font:16px system-ui}main{max-width:760px;margin:7vh auto;padding:24px}h1{font-size:27px}p{line-height:1.7;color:#c0cee0}code{color:#9ed4ff}button{background:#2770cf;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}#screen{position:fixed;inset:0;background:#000;display:none}canvas{display:block;image-rendering:pixelated}#warn{position:absolute;inset:0;padding:30px;background:#321719;color:#fff;display:none;font:18px system-ui;white-space:pre-wrap}</style>
<main id="controls"><h1>FPGA HDMI 精确画布</h1><p>此窗口只输出固定图片，不在电脑运行人脸识别，也不会连接串口或启动板子。</p><p>将窗口移到连接 FPGA 的 HDMI 屏幕，选择 <b>640 × 480</b> 输出，然后进入全屏。图片在本次服务器运行期间保持不变；ESC 返回说明。</p><p id="identity">正在校验图片…</p><button id="full" disabled>进入 HDMI 画布</button><p id="message"></p><p>浏览器画布通过，只能说明浏览器内部像素正确。显卡色彩转换、RGB/YUV、输出范围和板端采样还须用捕获 CRC 或像素读回确认。</p></main>
<div id="screen"><canvas id="canvas" width="640" height="480"></canvas><div id="warn"></div></div>
<script>
'use strict';
const nonce='__NONCE__', canvas=document.getElementById('canvas'),screenEl=document.getElementById('screen');
const ctx=canvas.getContext('2d',{alpha:false,colorSpace:'srgb',willReadFrequently:true});
let manifest=null, painted=false, actualCRC=null;
function crc32(bytes){let c=0xffffffff;for(const v of bytes){c^=v;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0);}return ((c^0xffffffff)>>>0).toString(16).padStart(8,'0');}
function geometry(){const d=devicePixelRatio;const w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);canvas.style.width=(640/d)+'px';canvas.style.height=(480/d)+'px';return {physical_width:w,physical_height:h,device_pixel_ratio:d,fullscreen:document.fullscreenElement===screenEl,viewport_matches:w===640&&h===480};}
function update(){const g=geometry();const ok=g.viewport_matches&&g.fullscreen&&painted;const warn=document.getElementById('warn');warn.style.display=ok?'none':'block';warn.textContent='尚未满足精确画布条件\n当前物理像素 '+g.physical_width+'×'+g.physical_height+'；目标640×480\n请检查HDMI显示模式与全屏状态。此时不要启动捕获。';return {...g,painted,rgb_crc32:actualCRC};}
async function init(){const responses=await Promise.all([fetch('/manifest'),fetch('/frame.rgb')]);manifest=await responses[0].json();const rgb=new Uint8Array(await responses[1].arrayBuffer());if(rgb.length!==921600||crc32(rgb)!==manifest.files['frame.rgb'].crc32)throw Error('输入校验失败');const image=ctx.createImageData(640,480);for(let i=0,j=0;i<rgb.length;i+=3,j+=4){image.data[j]=rgb[i];image.data[j+1]=rgb[i+1];image.data[j+2]=rgb[i+2];image.data[j+3]=255;}ctx.putImageData(image,0,0);const back=ctx.getImageData(0,0,640,480).data,readRGB=new Uint8Array(rgb.length);for(let i=0,j=0;i<rgb.length;i+=3,j+=4){readRGB[i]=back[j];readRGB[i+1]=back[j+1];readRGB[i+2]=back[j+2];}actualCRC=crc32(readRGB);painted=actualCRC===manifest.files['frame.rgb'].crc32;if(!painted)throw Error('画布读回校验失败');document.getElementById('identity').textContent='固定图片 RGB CRC32 '+actualCRC+'；640×480；无叠字或缩放。';document.getElementById('full').disabled=false;update();}
document.getElementById('full').addEventListener('click',async()=>{screenEl.style.display='block';try{await screenEl.requestFullscreen({navigationUI:'hide'});}catch(e){screenEl.style.display='none';document.getElementById('message').textContent='无法进入全屏：'+e.message;}update();});
document.addEventListener('fullscreenchange',()=>{screenEl.style.display=document.fullscreenElement===screenEl?'block':'none';update();});window.addEventListener('resize',update);
setInterval(()=>{if(!manifest)return;fetch('/display-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nonce,...update()})}).catch(()=>{});},1000);
window.sourceDiagnostics=()=>update();init().catch(e=>document.getElementById('message').textContent=e.message);
</script></html>
