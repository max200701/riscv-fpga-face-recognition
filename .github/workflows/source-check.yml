name: Source and waveform checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -B tools/verify_package.py
      - run: python -B tools/test_host.py
      - run: node 05_tests/host/test_metrics56.js
      - run: python -B tools/verify_waveforms.py
